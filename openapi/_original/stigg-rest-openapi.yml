openapi: 3.0.0
info:
  title: Stigg REST API
  description: >-
    The Stigg REST API (Public Beta) provides RESTful HTTP access to customer management,
    subscription provisioning, entitlement enforcement, and usage metering. It supports
    TypeScript, Python, Go, Ruby, C#, and Java SDKs and accepts API key authentication
    via the X-API-KEY header. Base URL: https://api.stigg.io/api/v1
  version: 7.10.0
  contact:
    url: https://www.stigg.io/
  termsOfService: https://www.stigg.io/terms
servers:
  - url: https://api.stigg.io
    description: Stigg Production API
tags:
  - name: Customers
    description: Customer provisioning and management.
  - name: Subscriptions
    description: Subscription lifecycle management.
  - name: Usage
    description: Usage reporting and event-based metering.
  - name: Coupons
    description: Coupon retrieval.
paths:
  /api/v1/customers:
    post:
      tags:
        - Customers
      summary: Provision customer
      description: >-
        Creates a new customer and optionally provisions an initial subscription
        in a single operation.
      operationId: CustomerController_provisionCustomer
      parameters:
        - name: X-ACCOUNT-ID
          in: header
          description: >-
            Account ID — optional when authenticating with a user JWT (Bearer
            token); falls back to the user's first membership. Ignored for
            API-key auth.
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          description: >-
            Environment ID — required when authenticating with a user JWT
            (Bearer token) on environment-scoped endpoints. Ignored for API-key
            auth (env is intrinsic to the key).
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionCustomerRequestDto'
            examples:
              basic:
                summary: Provision a customer
                value:
                  id: customer-123
                  name: Acme Corp
                  email: billing@acme.com
      responses:
        '201':
          description: The newly created customer object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '409':
          description: Customer conflict error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
    get:
      tags:
        - Customers
      summary: List customers
      description: Retrieves a paginated list of customers in the environment.
      operationId: CustomerController_getCustomers
      parameters:
        - name: after
          required: false
          in: query
          description: Return items that come after this cursor
          schema:
            format: uuid
            type: string
        - name: before
          required: false
          in: query
          description: Return items that come before this cursor
          schema:
            format: uuid
            type: string
        - name: limit
          required: false
          in: query
          description: Maximum number of items to return
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: integer
        - name: email
          required: false
          in: query
          description: Filter by exact customer email address
          schema:
            maxLength: 255
            type: string
        - name: name
          required: false
          in: query
          description: Filter by exact customer name
          schema:
            maxLength: 255
            type: string
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of customer objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/customers/{id}:
    patch:
      tags:
        - Customers
      summary: Update a customer
      description: >-
        Updates an existing customer's properties such as name, email, and
        billing information.
      operationId: CustomerController_patchCustomer
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the customer
          schema:
            minLength: 1
            maxLength: 255
            type: string
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequestDto'
      responses:
        '200':
          description: The updated customer object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/subscriptions:
    post:
      tags:
        - Subscriptions
      summary: Provision subscription
      description: >-
        Creates a new subscription for an existing customer. When payment is
        required and no payment method exists, returns a checkout URL.
      operationId: SubscriptionController_provisionSubscription
      parameters:
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionSubscriptionRequestDto'
            examples:
              basic:
                summary: Provision a subscription
                value:
                  customerId: customer-123
                  planId: plan-pro
      responses:
        '201':
          description: The newly created subscription object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '409':
          description: Subscription conflict error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
    get:
      tags:
        - Subscriptions
      summary: List subscriptions
      description: >-
        Retrieves a paginated list of subscriptions, with optional filters for
        customer, status, and plan.
      operationId: SubscriptionController_getSubscriptions
      parameters:
        - name: after
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: before
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: integer
        - name: customerId
          required: false
          in: query
          description: Filter by customer ID
          schema:
            type: string
        - name: status
          required: false
          in: query
          description: Filter by subscription status
          schema:
            type: string
            enum: [active, canceled, trial, paused]
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of subscription objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/subscriptions/{id}:
    get:
      tags:
        - Subscriptions
      summary: Get subscription by ID
      description: >-
        Retrieves a subscription by its unique identifier, including plan
        details, billing period, status, and add-ons.
      operationId: SubscriptionController_getSubscription
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the subscription
          schema:
            minLength: 1
            maxLength: 255
            type: string
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The subscription object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '404':
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/subscriptions/{id}/cancel:
    post:
      tags:
        - Subscriptions
      summary: Cancel subscription
      description: >-
        Cancels an active subscription, either immediately or at a specified
        time such as end of billing period.
      operationId: SubscriptionController_cancelSubscription
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the subscription
          schema:
            minLength: 1
            maxLength: 255
            type: string
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequestDto'
      responses:
        '200':
          description: The canceled subscription object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '404':
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/subscriptions/preview:
    post:
      tags:
        - Subscriptions
      summary: Preview subscription
      description: >-
        Previews the pricing impact of creating or updating a subscription
        without making changes. Returns estimated costs, taxes, and proration
        details.
      operationId: SubscriptionController_previewSubscription
      parameters:
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewSubscriptionRequestDto'
      responses:
        '200':
          description: Subscription pricing preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewSubscriptionResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/usage:
    post:
      tags:
        - Usage
      summary: Report usage measurements
      description: >-
        Reports usage measurements for metered features. The reported usage is
        used to track, limit, and bill customer consumption.
      operationId: UsageController_reportUsage
      parameters:
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUsageRequestDto'
            examples:
              basic:
                summary: Report API call usage
                value:
                  customerId: customer-123
                  featureId: feature-api-calls
                  value: 100
      responses:
        '201':
          description: The recorded usage measurement objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '409':
          description: Usage conflict error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/events:
    post:
      tags:
        - Usage
      summary: Report usage events
      description: >-
        Reports raw usage events for event-based metering. Events are ingested
        asynchronously and aggregated into usage totals.
      operationId: EventsController_reportEvent
      parameters:
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportEventRequestDto'
            examples:
              basic:
                summary: Report a usage event
                value:
                  customerId: customer-123
                  featureId: feature-api-calls
                  eventName: api_request
                  idempotencyKey: evt-unique-001
      responses:
        '200':
          description: Confirmation that events were accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponseDto'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadInputErrorResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/coupons:
    get:
      tags:
        - Coupons
      summary: List coupons
      description: Retrieves a paginated list of coupons in the environment.
      operationId: CouponsController_getCoupons
      parameters:
        - name: after
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: before
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: integer
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of coupon objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponListResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/coupons/{id}:
    get:
      tags:
        - Coupons
      summary: Get coupon by ID
      description: Retrieves a coupon by its unique identifier.
      operationId: CouponsController_getCoupon
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the coupon
          schema:
            minLength: 1
            maxLength: 255
            type: string
        - name: X-ACCOUNT-ID
          in: header
          required: false
          schema:
            type: string
        - name: X-ENVIRONMENT-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The coupon object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '404':
          description: Coupon not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
components:
  schemas:
    PaginationDto:
      type: object
      properties:
        next:
          type: string
          format: uuid
          description: Cursor for fetching the next page of results, or null if no additional pages exist.
          nullable: true
        prev:
          type: string
          format: uuid
          description: Cursor for fetching the previous page of results, or null if at the beginning.
          nullable: true
      required:
        - next
        - prev
      description: Pagination metadata including cursors for navigating through results.
    PaymentMethodDto:
      type: object
      properties:
        billingId:
          type: string
          maxLength: 255
          description: The default payment method id.
          nullable: true
        type:
          type: string
          enum:
            - CARD
            - BANK
            - CASH_APP
          description: The default payment method type.
        cardLast4Digits:
          type: string
          maxLength: 255
          description: The last 4 digits of the default payment method.
          nullable: true
        cardExpiryMonth:
          type: number
          description: The expiration month of the default payment method.
          nullable: true
        cardExpiryYear:
          type: number
          description: The expiration year of the default payment method.
          nullable: true
      required:
        - billingId
        - type
        - cardLast4Digits
        - cardExpiryMonth
        - cardExpiryYear
      description: The default payment method details.
    CustomerIntegrationDto:
      type: object
      properties:
        vendorIdentifier:
          type: string
          enum:
            - AUTH0
            - ZUORA
            - STRIPE
            - HUBSPOT
            - AWS_MARKETPLACE
            - SNOWFLAKE
            - SALESFORCE
            - BIG_QUERY
            - OPEN_FGA
            - APP_STORE
            - RECEIVED
            - PREQUEL
          description: The vendor identifier of integration.
        syncedEntityId:
          type: string
          maxLength: 255
          description: Synced entity id.
          nullable: true
        id:
          type: string
          maxLength: 255
          description: Integration details.
      required:
        - vendorIdentifier
        - syncedEntityId
        - id
      description: External billing or CRM integration link.
    CustomerDto:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_|.@-]*$
          description: Customer slug.
        name:
          type: string
          maxLength: 255
          description: The name of the customer.
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
          description: The email of the customer.
          nullable: true
        billingId:
          type: string
          maxLength: 255
          description: The unique identifier for the entity in the billing provider.
          nullable: true
        billingCurrency:
          type: string
          description: The billing currency of the customer.
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional metadata.
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/CustomerIntegrationDto'
          description: List of integrations.
        defaultPaymentMethod:
          $ref: '#/components/schemas/PaymentMethodDto'
        couponId:
          type: string
          description: Customer level coupon.
          nullable: true
        timezone:
          type: string
          maxLength: 255
