openapi: 3.2.0
info:
  title: Stigg REST Coupons API
  description: 'The Stigg REST API (Public Beta) provides RESTful HTTP access to customer management, subscription provisioning, entitlement enforcement, and usage metering. It supports TypeScript, Python, Go, Ruby, C#, and Java SDKs and accepts API key authentication via the X-API-KEY header. Base URL: https://api.stigg.io/api/v1'
  version: 7.10.0
  contact:
    url: https://www.stigg.io/
  termsOfService: https://www.stigg.io/terms
servers:
- url: https://api.stigg.io
  description: Stigg Production API
security:
- ApiKeyAuth: []
tags:
- name: Coupons
  description: Coupon retrieval.
paths:
  /api/v1/coupons:
    get:
      tags:
      - Coupons
      summary: List coupons
      description: Retrieves a paginated list of coupons in the environment.
      operationId: CouponsController_getCoupons
      parameters:
      - name: after
        required: false
        in: query
        schema:
          format: uuid
          type: string
      - name: before
        required: false
        in: query
        schema:
          format: uuid
          type: string
      - name: limit
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 100
          default: 20
          type: integer
      - name: X-ACCOUNT-ID
        in: header
        required: false
        schema:
          type: string
      - name: X-ENVIRONMENT-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A paginated list of coupon objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponListResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
  /api/v1/coupons/{id}:
    get:
      tags:
      - Coupons
      summary: Get coupon by ID
      description: Retrieves a coupon by its unique identifier.
      operationId: CouponsController_getCoupon
      parameters:
      - name: id
        required: true
        in: path
        description: The unique identifier of the coupon
        schema:
          minLength: 1
          maxLength: 255
          type: string
      - name: X-ACCOUNT-ID
        in: header
        required: false
        schema:
          type: string
      - name: X-ENVIRONMENT-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The coupon object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponResponseDto'
        '401':
          description: User is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedErrorResponseDto'
        '403':
          description: User is not allowed to access this resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDto'
        '404':
          description: Coupon not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponseDto'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsErrorResponseDto'
components:
  schemas:
    NotFoundErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        code:
          type:
          - string
          - 'null'
      required:
      - message
      - code
      description: Resource not found error response.
    CouponResponseDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CouponDto'
      required:
      - data
      description: Single coupon response.
    TooManyRequestsErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        code:
          type:
          - string
          - 'null'
          enum:
          - RateLimitExceeded
      required:
      - message
      - code
      description: Rate limit exceeded error response.
    ForbiddenErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        code:
          type:
          - string
          - 'null'
          enum:
          - IdentityForbidden
          - AccessDeniedError
          - NoFeatureEntitlementError
      required:
      - message
      - code
      description: Authorization error response.
    PaginationDto:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          format: uuid
          description: Cursor for fetching the next page of results, or null if no additional pages exist.
        prev:
          type:
          - string
          - 'null'
          format: uuid
          description: Cursor for fetching the previous page of results, or null if at the beginning.
      required:
      - next
      - prev
      description: Pagination metadata including cursors for navigating through results.
    UnauthenticatedErrorResponseDto:
      type: object
      properties:
        message:
          type: string
        code:
          type:
          - string
          - 'null'
          enum:
          - Unauthenticated
      required:
      - message
      - code
      description: Authentication error response.
    CouponDto:
      type: object
      properties:
        id:
          type: string
          description: Coupon identifier.
        name:
          type: string
          description: Coupon display name.
        discountValue:
          type: number
          description: Discount amount or percentage value.
        discountType:
          type: string
          enum:
          - PERCENTAGE
          - FIXED
          description: Whether discount is a percentage or fixed amount.
        currency:
          type:
          - string
          - 'null'
          description: Currency for fixed-amount coupons.
        maxRedemptions:
          type:
          - integer
          - 'null'
          description: Maximum number of times this coupon can be redeemed.
        redemptionsCount:
          type: integer
          description: Number of times this coupon has been redeemed.
        isArchived:
          type: boolean
          description: Whether this coupon is archived.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - discountValue
      - discountType
      - createdAt
      - updatedAt
      description: A discount coupon.
    CouponListResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CouponDto'
        pagination:
          $ref: '#/components/schemas/PaginationDto'
      required:
      - data
      - pagination
      description: Paginated list of coupons.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Full access key from the Stigg dashboard (Integrations > API Keys).
