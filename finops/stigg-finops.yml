specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Stigg
providerId: stigg
publisherName: Stigg Ltd.
serviceCategory: Pricing & Entitlements Platform
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Pricing
  - Billing
  - Entitlements
  - Usage-Based Billing
  - SaaS
description: FOCUS-aligned FinOps definition for Stigg. Stigg is itself a pricing/entitlement platform
  billed as a tiered SaaS subscription (Sandbox / Growth / Scale) plus per-seat and per-subscription metered
  charges and per-GB event metering.
sources:
  - https://www.stigg.io/pricing
billingModel:
  pricingCategory: Tiered Subscription + Usage-Based Add-Ons
  billingFrequency: Monthly or Annual
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Stigg
  ServiceCategory: Pricing & Entitlements Platform
  ProviderName: Stigg
  PublisherName: Stigg Ltd.
  InvoiceIssuerName: Stigg Ltd.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: base_subscription
    description: Monthly or annual base platform fee for the Growth or Scale plan
    unit: month
    aggregation: sum
    dimensions:
      - plan
  - name: seats
    description: Active team-member seats charged per month
    unit: seat
    aggregation: max
    dimensions:
      - role
  - name: self_service_subscriptions
    description: Self-service subscriptions managed in Stigg billed at $0.32 each
    unit: subscription
    aggregation: count
    dimensions:
      - plan
      - product
  - name: custom_subscriptions
    description: Custom (wire/ACH) subscriptions billed at $4.70 each
    unit: subscription
    aggregation: count
    dimensions:
      - plan
      - product
  - name: event_metering_volume
    description: Advanced event metering data processed/stored, billed per GB per month
    unit: GB
    aggregation: sum
    dimensions:
      - feature
      - environment
  - name: integration_addons
    description: Optional per-integration add-on charges (Slack support, AWS Marketplace, Snowflake,
      BigQuery, Salesforce native)
    unit: month
    aggregation: sum
    dimensions:
      - integration
principles:
  - name: Visibility
    description: Use the Stigg admin console and customer-portal usage views, plus the Stripe/Zuora
      integration export, to surface subscription counts, seats, and event-metering GB to product/finance.
  - name: Allocation
    description: Tag subscriptions with environment (Sandbox vs Production) and product to attribute
      Stigg cost to the customer-facing product line that drives subscription volume.
  - name: Optimization
    description: Levers include consolidating non-production environments under Sandbox, choosing annual
      billing for the 20% discount, batching event ingestion to reduce GB-month, and avoiding wire/ACH
      subscription type ($4.70) where self-service ($0.32) is acceptable.
  - name: Accountability
    description: Designate a Stigg admin per workspace; route invoices to the platform-engineering or
      monetization owner; review subscription growth and event GB monthly against the Growth plan budget.
maintainers:
