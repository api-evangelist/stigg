naftiko: 1.0.0-alpha2
info:
  label: Stigg API — Entitlements
  description: 'Stigg API — Entitlements. 1 operations. Lead operation: Execute GraphQL Query or Mutation. Self-contained
    Naftiko capability covering one Stigg business surface.'
  tags:
  - Stigg
  - Entitlements
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    STIGG_API_KEY: STIGG_API_KEY
capability:
  consumes:
  - type: http
    namespace: stigg-entitlements
    baseUri: https://api.stigg.io
    description: Stigg API — Entitlements business capability. Self-contained, no shared references.
    resources:
    - name: graphql
      path: /graphql
      operations:
      - name: executegraphql
        method: POST
        description: Execute GraphQL Query or Mutation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-API-KEY
      value: '{{env.STIGG_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: stigg-entitlements-rest
    port: 8080
    description: REST adapter for Stigg API — Entitlements. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/graphql
      name: graphql
      description: REST surface for graphql.
      operations:
      - method: POST
        name: executegraphql
        description: Execute GraphQL Query or Mutation
        call: stigg-entitlements.executegraphql
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: stigg-entitlements-mcp
    port: 9090
    transport: http
    description: MCP adapter for Stigg API — Entitlements. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: execute-graphql-query-mutation
      description: Execute GraphQL Query or Mutation
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: stigg-entitlements.executegraphql
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
