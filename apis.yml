aid: stigg
name: Stigg
description: >-
  Stigg is a product-led growth monetization platform providing REST and GraphQL APIs for managing pricing
  plans, entitlements, usage-based billing, feature flags, and subscription lifecycle. It serves as a
  monetization control layer for SaaS and AI products, enabling engineering teams to implement flexible
  pricing, granular access control, and real-time usage metering without rebuilding billing infrastructure
  from scratch. Stigg is SOC 2 Type II and ISO 27001 certified and delivers 99.99% uptime SLA with
  multi-region deployment.
