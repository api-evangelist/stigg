specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Stigg
providerId: stigg
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - Pricing
  - Billing
  - Entitlements
  - Usage-Based Billing
  - SaaS
  - Rate Limiting
description: Stigg documents that the GraphQL and REST APIs are rate limited per endpoint, but the published
  rate-limits page references a separate per-endpoint table that was not directly accessible during reconciliation.
  Limits are enforced per API key. This artifact captures the policy surface; specific per-endpoint numbers
  should be sourced from the live docs.
sources:
  - https://docs.stigg.io/docs/rate-limits
responseCodes:
  throttled: 429
limits:
  - name: GraphQL and REST API Rate Limits
    scope: api-key
    metric: varies
    limit: see https://docs.stigg.io/docs/rate-limits for per-endpoint limits
    notes: Stigg publishes per-endpoint rate limits referenced from the GraphQL rate-limits documentation.
      Limits scope to the API key.
policies:
  - name: Per-Endpoint Limits
    description: Stigg sets distinct rate limits per endpoint rather than a global account ceiling; consult
      the per-endpoint table in the rate-limits documentation.
  - name: Backoff Strategy
    description: Clients receiving HTTP 429 should back off and retry; exponential backoff with jitter
      is recommended.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
